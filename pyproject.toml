[project]
name = "procurement-parser"
version = "0.1.0"
description = "Durable ETL parser for EEP MITWORK and Zakup SK"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "curl-cffi>=0.11",
    "httpx[http2]>=0.28",
    "orjson>=3.10",
    "playwright==1.60.0",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "selectolax>=0.3.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=25.1",
    "tenacity>=9.0",
    "tzdata>=2025.2",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
procurement-parser = "procurement_parser.entrypoints.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_parser"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["procurement_parser"]
omit = [
    "*/__main__.py",
    "*/entrypoints/*",
    "*/application/factory.py",
    "*/sources/*/adapter.py",
    "*/sources/*/browser.py",
    "*/sources/*/bundle_cache.py",
    "*/sources/*/client.py",
    "*/sources/*/strategies.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
