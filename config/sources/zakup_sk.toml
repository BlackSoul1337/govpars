[source]
name = "zakup-sk"
base_url = "https://zakup.sk.kz"
request_timeout_seconds = 60
per_page = 10
max_attempts = 4
active_refresh_seconds = 900
list_refresh_seconds = 300
closed_refresh_seconds = 86400
old_refresh_seconds = 604800
full_reconcile_seconds = 604800
recently_closed_window_seconds = 1209600
browser_profile_dir = "playwright/.auth/zakup"

[source.endpoints]
lots = "/eprocsearch/api/external/lots"
adverts = "/eprocsearch/api/external/4dv3rts"
plan_items = "/eprocsearch/api/external/plan-items"

[source.concurrency]
direct = 2
proxy = 4
